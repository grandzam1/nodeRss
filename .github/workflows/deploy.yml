name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Run tests when available
        shell: bash
        run: |
          if node -e "process.exit(Object.hasOwn(require('./package.json').scripts ?? {}, 'test') ? 0 : 1)"; then
            npm test
          else
            echo "::warning::No test script is defined on this branch; skipping tests."
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@48.10.0

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
